name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "17 3 * * *" # una vez al día (03:17 UTC)
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Usa tu PAT si creas el secreto SUMMARY_GITHUB_TOKEN; si no, el token integrado
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          TIME_ZONE: "Europe/Madrid"
          EXCLUDE: ""
          AUTO_PUSH: true
